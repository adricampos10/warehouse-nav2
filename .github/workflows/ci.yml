# CI: on every pull request and every push to main, run the unit tests, then
# every navigation scenario in its own headless Gazebo simulation (one
# parallel job per file in scenarios/), and publish a summary table of the
# results. A pull request that only changes documentation (README.md or
# docs/) skips the tests and the scenarios.
name: CI

on:
  # Branches are tested once, in their pull request (on the result of merging
  # them into main); main is tested again after each merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Decides whether the tests need to run. I can't use paths-ignore on the
  # whole workflow: main requires the report check, and a workflow that
  # doesn't start never reports it, so the pull request would wait forever.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether anything besides documentation changed
        id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"  # main and manual runs: always test everything
            exit 0
          fi
          echo "Files changed in this pull request:"
          git diff --name-only "$BASE" HEAD | tee changed.txt
          if grep -vE '^(README\.md|docs/)' changed.txt | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed: skipping the tests and the scenarios."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the unit tests
        run: pytest -v

  list-scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: List the scenario files
        id: list
        run: echo "names=$(ls scenarios/*.yaml | xargs -n1 basename | sed 's/\.yaml$//' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # Builds the simulation image once and stores its layers in GitHub Actions'
  # cache. Before, every scenario job built it from scratch, downloading
  # ROS 2, Nav2 and Gazebo from Ubuntu's mirrors 11 times per run; when the
  # mirrors were slow, jobs failed or hit the 30-minute timeout. Now the
  # layers are only rebuilt when docker/Dockerfile changes.
  build-image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the Docker image into the cache
        uses: docker/build-push-action@v7
        with:
          context: docker/
          cache-from: type=gha,scope=warehouse-nav2
          cache-to: type=gha,mode=max,scope=warehouse-nav2

  scenario:
    name: scenario (${{ matrix.scenario }})
    needs: [unit-tests, list-scenarios, build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.list-scenarios.outputs.names) }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Load the Docker image from the cache
        uses: docker/build-push-action@v7
        with:
          context: docker/
          tags: warehouse-nav2:jazzy
          load: true
          cache-from: type=gha,scope=warehouse-nav2

      - name: Run the scenario
        run: scripts/run_scenarios.sh ${{ matrix.scenario }}

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.scenario }}
          path: results/${{ matrix.scenario }}.json
          if-no-files-found: warn

  # Also the single gate for branch protection: it always runs, writes the
  # table and fails if the unit tests or any scenario failed, so main only
  # needs to require this one check, however many scenarios there are. For a
  # documentation-only pull request it passes without them.
  report:
    needs: [changes, unit-tests, build-image, scenario]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Download the results
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          merge-multiple: true
          path: results

      - name: Write the summary table
        if: needs.changes.outputs.code == 'true'
        run: python3 scripts/report.py results/*.json >> "$GITHUB_STEP_SUMMARY"

      - name: Say why nothing ran
        if: needs.changes.outputs.code == 'false'
        run: echo "Only documentation changed, so the tests and scenarios were skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the change check, the unit tests or any scenario failed
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.code == 'true' &&
           (needs.unit-tests.result != 'success' || needs.scenario.result != 'success'))
        run: |
          echo "changes: ${{ needs.changes.result }}, unit-tests: ${{ needs.unit-tests.result }}, scenarios: ${{ needs.scenario.result }}"
          exit 1
