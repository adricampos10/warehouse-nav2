# CI: on every push and pull request, build the Docker image and run the
# Nav2 smoke test in a headless Gazebo simulation.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Build the Docker image
        run: docker build -t warehouse-nav2:jazzy docker/

      - name: Run the Nav2 smoke test
        run: scripts/run_smoke_test.sh
