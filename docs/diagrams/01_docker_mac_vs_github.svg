<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 680 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Docker on my Mac and on GitHub</title>
<desc>On the Mac, Docker Desktop creates a Linux VM and the ROS 2 container runs inside it. On GitHub, the runner is already an Ubuntu VM and the same container runs inside it.</desc>
<rect width="680" height="400" fill="#FFFFFF"/>
<g>
<rect x="40" y="30" width="280" height="320" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="56" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Computer (macOS)</text>
<text x="180" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Local machine</text>
</g>
<g>
<rect x="60" y="96" width="240" height="230" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="180" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Docker Linux VM</text>
<text x="180" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Created by Docker Desktop</text>
</g>
<g>
<rect x="80" y="160" width="200" height="140" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="180" y="215" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">ROS 2 container</text>
<text x="180" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Nav2 · Gazebo · tests</text>
</g>
<g>
<rect x="360" y="30" width="280" height="320" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="500" y="56" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">GitHub servers</text>
<text x="500" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">In the cloud</text>
</g>
<g>
<rect x="380" y="96" width="240" height="230" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Ubuntu VM (runner)</text>
<text x="500" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Created by GitHub</text>
</g>
<g>
<rect x="400" y="160" width="200" height="140" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="500" y="215" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">ROS 2 container</text>
<text x="500" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Nav2 · Gazebo · tests</text>
</g>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Grey = computer · green = Linux VM · purple = the same container</text>
</svg>
