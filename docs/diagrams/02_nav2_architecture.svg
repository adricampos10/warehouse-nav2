<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Nav2 in this project</title>
<desc>The nodes that tb3_simulation_launch.py starts: my scripts send goals to bt_navigator, whose behavior tree calls the planner, controller and behavior servers through actions; the velocity command goes through velocity_smoother and collision_monitor to the simulated robot, while map_server and amcl provide the map and the robot's pose.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#444441"/>
</marker>
</defs>
<rect width="1360" height="800" fill="#FFFFFF"/>

<text x="30" y="36" font-size="22" font-weight="600" fill="#2C2C2A">Nav2 in this project: nodes, actions and topics</text>
<text x="30" y="62" font-size="13" fill="#5F5E5A">What tb3_simulation_launch.py starts in my container (ROS 2 Jazzy, default nav2_params.yaml)</text>

<text x="615" y="92" text-anchor="middle" font-size="12" fill="#444441">/initialpose  (setInitialPose)</text>

<!-- Left column: my code and the viewer -->
<g>
<rect x="30" y="150" width="230" height="170" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="145" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#633806">My scripts</text>
<text x="145" y="198" text-anchor="middle" font-size="12" fill="#854F0B">run_scenario.py</text>
<text x="145" y="216" text-anchor="middle" font-size="12" fill="#854F0B">smoke_test.py · patrol.py</text>
<text x="145" y="242" text-anchor="middle" font-size="12" fill="#854F0B">BasicNavigator</text>
<text x="145" y="260" text-anchor="middle" font-size="12" fill="#854F0B">(nav2_simple_commander)</text>
<text x="145" y="284" text-anchor="middle" font-size="12" fill="#854F0B">goToPose() → navigate_to_pose</text>
<text x="145" y="304" text-anchor="middle" font-size="11" fill="#854F0B">also records /odom and /scan</text>
</g>
<g>
<rect x="30" y="345" width="230" height="100" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="145" y="369" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">Lichtblick</text>
<text x="145" y="391" text-anchor="middle" font-size="12" fill="#993C1D">3D panel · Publish pose → /goal_pose</text>
<text x="145" y="411" text-anchor="middle" font-size="11" fill="#993C1D">shows /map, costmaps, /plan, /scan</text>
<text x="145" y="427" text-anchor="middle" font-size="11" fill="#993C1D">through foxglove_bridge</text>
</g>

<!-- Navigation launch group -->
<rect x="280" y="120" width="800" height="490" rx="14" fill="#FAFAFF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="1068" y="136" text-anchor="end" font-size="12" fill="#534AB7">navigation_launch.py</text>

<g>
<rect x="300" y="152" width="620" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="610" y="176" text-anchor="middle" font-size="16" font-weight="600" fill="#3C3489">bt_navigator</text>
<text x="610" y="200" text-anchor="middle" font-size="12" fill="#534AB7">Action servers navigate_to_pose and navigate_through_poses · also listens to /goal_pose</text>
<text x="610" y="220" text-anchor="middle" font-size="12" fill="#534AB7">Ticks the behavior tree navigate_to_pose_w_replanning_and_recovery.xml</text>
<text x="610" y="240" text-anchor="middle" font-size="12" fill="#534AB7">Replan at 1 Hz → FollowPath · recoveries: clear costmaps, Spin, Wait, BackUp</text>
</g>
<g>
<rect x="936" y="152" width="132" height="110" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="1002" y="173" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Also started</text>
<text x="1002" y="194" text-anchor="middle" font-size="11" fill="#534AB7">waypoint_follower</text>
<text x="1002" y="211" text-anchor="middle" font-size="11" fill="#534AB7">route_server</text>
<text x="1002" y="228" text-anchor="middle" font-size="11" fill="#534AB7">docking_server</text>
<text x="1002" y="249" text-anchor="middle" font-size="10.5" fill="#7F77DD">not used by my scenarios</text>
</g>

<!-- Actions from the behavior tree to the servers -->
<path d="M384,262 L384,298" fill="none" stroke="#444441" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M581,262 L581,298" fill="none" stroke="#444441" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M778,262 L778,298" fill="none" stroke="#444441" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M900,262 L960,298" fill="none" stroke="#B4B2A9" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

<g>
<rect x="292" y="300" width="185" height="170" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="384" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">planner_server</text>
<text x="384" y="342" text-anchor="middle" font-size="11" fill="#534AB7">action: compute_path_to_pose</text>
<text x="384" y="360" text-anchor="middle" font-size="11" fill="#534AB7">plugin: NavfnPlanner</text>
<rect x="302" y="372" width="165" height="86" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="384" y="391" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">global_costmap (map)</text>
<text x="384" y="409" text-anchor="middle" font-size="11" fill="#534AB7">static layer ← /map</text>
<text x="384" y="426" text-anchor="middle" font-size="11" fill="#534AB7">obstacle layer ← /scan</text>
<text x="384" y="443" text-anchor="middle" font-size="11" fill="#534AB7">inflation layer</text>
</g>
<g>
<rect x="489" y="300" width="185" height="170" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="581" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">controller_server</text>
<text x="581" y="342" text-anchor="middle" font-size="11" fill="#534AB7">action: follow_path</text>
<text x="581" y="360" text-anchor="middle" font-size="11" fill="#534AB7">MPPIController + goal checker</text>
<rect x="499" y="372" width="165" height="86" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="581" y="391" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">local_costmap (odom)</text>
<text x="581" y="409" text-anchor="middle" font-size="11" fill="#534AB7">rolling window</text>
<text x="581" y="426" text-anchor="middle" font-size="11" fill="#534AB7">voxel layer ← /scan</text>
<text x="581" y="443" text-anchor="middle" font-size="11" fill="#534AB7">inflation layer</text>
</g>
<g>
<rect x="686" y="300" width="185" height="170" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="778" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">behavior_server</text>
<text x="778" y="342" text-anchor="middle" font-size="11" fill="#534AB7">actions: spin · backup · wait</text>
<text x="778" y="360" text-anchor="middle" font-size="11" fill="#534AB7">drive_on_heading · assisted_teleop</text>
<rect x="696" y="372" width="165" height="86" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="778" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">recovery moves</text>
<text x="778" y="416" text-anchor="middle" font-size="11" fill="#534AB7">checks collisions on the</text>
<text x="778" y="433" text-anchor="middle" font-size="11" fill="#534AB7">costmaps before moving</text>
</g>
<g>
<rect x="883" y="300" width="185" height="170" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="975" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">smoother_server</text>
<text x="975" y="342" text-anchor="middle" font-size="11" fill="#534AB7">action: smooth_path</text>
<text x="975" y="360" text-anchor="middle" font-size="11" fill="#534AB7">plugin: SimpleSmoother</text>
<text x="975" y="406" text-anchor="middle" font-size="11" fill="#7F77DD">ready, but the default</text>
<text x="975" y="423" text-anchor="middle" font-size="11" fill="#7F77DD">behavior tree never calls it</text>
</g>

<!-- Velocity command chain -->
<path d="M581,470 L581,555 L598,555" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="573" y="500" text-anchor="end" font-size="11" fill="#444441">/cmd_vel_nav</text>
<path d="M720,470 L720,518" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="728" y="500" font-size="11" fill="#444441">/cmd_vel_nav</text>
<g>
<rect x="600" y="520" width="160" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="680" y="547" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">velocity_smoother</text>
<text x="680" y="569" text-anchor="middle" font-size="11" fill="#534AB7">limits speed and acceleration</text>
</g>
<path d="M760,555 L888,555" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="824" y="546" text-anchor="middle" font-size="11" fill="#444441">/cmd_vel_smoothed</text>
<g>
<rect x="890" y="520" width="160" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="970" y="547" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">collision_monitor</text>
<text x="970" y="569" text-anchor="middle" font-size="11" fill="#534AB7">slows or stops ← /scan</text>
</g>
<path d="M1050,555 L1098,555" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1076" y="546" text-anchor="middle" font-size="11" fill="#444441">/cmd_vel</text>

<!-- Localization launch group -->
<rect x="1100" y="120" width="240" height="210" rx="14" fill="#FAFAFF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="1328" y="136" text-anchor="end" font-size="12" fill="#534AB7">localization_launch.py</text>
<g>
<rect x="1112" y="150" width="216" height="62" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="1220" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">map_server</text>
<text x="1220" y="196" text-anchor="middle" font-size="11" fill="#534AB7">publishes /map (the tb3 world map)</text>
</g>
<path d="M1220,212 L1220,238" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1228" y="229" font-size="11" fill="#444441">/map</text>
<g>
<rect x="1112" y="240" width="216" height="78" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="1220" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">amcl</text>
<text x="1220" y="284" text-anchor="middle" font-size="11" fill="#534AB7">particle filter localization</text>
<text x="1220" y="302" text-anchor="middle" font-size="11" fill="#534AB7">publishes TF map → odom</text>
</g>

<!-- Simulated robot -->
<path d="M1220,380 L1220,320" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1228" y="356" font-size="11" fill="#444441">/scan</text>
<g>
<rect x="1100" y="380" width="240" height="230" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="1220" y="404" text-anchor="middle" font-size="15" font-weight="600" fill="#0C447C">Simulated robot</text>
<text x="1220" y="424" text-anchor="middle" font-size="11" fill="#185FA5">Gazebo Harmonic · TurtleBot3 Waffle</text>
<line x1="1120" y1="438" x2="1320" y2="438" stroke="#185FA5" stroke-width="0.5"/>
<text x="1220" y="458" text-anchor="middle" font-size="12" font-weight="600" fill="#0C447C">ros_gz_bridge</text>
<text x="1220" y="477" text-anchor="middle" font-size="11" fill="#185FA5">publishes /scan · /odom · /clock</text>
<text x="1220" y="494" text-anchor="middle" font-size="11" fill="#185FA5">and /tf odom → base_link</text>
<text x="1220" y="511" text-anchor="middle" font-size="11" fill="#185FA5">subscribes to /cmd_vel</text>
<line x1="1120" y1="527" x2="1320" y2="527" stroke="#185FA5" stroke-width="0.5"/>
<text x="1220" y="550" text-anchor="middle" font-size="12" font-weight="600" fill="#0C447C">robot_state_publisher</text>
<text x="1220" y="569" text-anchor="middle" font-size="11" fill="#185FA5">/tf_static base_link → base_scan</text>
<text x="1220" y="590" text-anchor="middle" font-size="11" fill="#185FA5">(from the robot's URDF)</text>
</g>

<!-- Goals and initial pose, drawn on top of the launch groups -->
<path d="M140,150 L140,100 L1090,100 L1090,285 L1110,285" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M260,190 L298,190" fill="none" stroke="#444441" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M260,380 L270,380 L270,240 L298,240" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>

<!-- Lifecycle manager -->
<g>
<rect x="280" y="628" width="1060" height="50" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="810" y="648" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">nav2_lifecycle_manager (one for localization, one for navigation)</text>
<text x="810" y="667" text-anchor="middle" font-size="12" fill="#534AB7">At startup it takes every Nav2 node through configure → activate (autostart), and it can pause, reset or shut them all down together.</text>
</g>

<!-- Legend -->
<g font-size="12" fill="#444441">
<rect x="30" y="706" width="18" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="56" y="718">Nav2 node</text>
<rect x="150" y="706" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="176" y="718">plugin, costmap or idle node</text>
<rect x="380" y="706" width="18" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="406" y="718">my code</text>
<rect x="490" y="706" width="18" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="516" y="718">viewer</text>
<rect x="590" y="706" width="18" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="616" y="718">simulated robot</text>
<path d="M760,713 L800,713" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="808" y="718">topic</text>
<path d="M870,713 L910,713" stroke="#444441" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="918" y="718">action (goal, feedback, result)</text>
</g>
<text x="30" y="750" font-size="12" fill="#444441">TF tree: map → odom (amcl) → base_link (odometry) → base_scan (robot_state_publisher). The global costmap works in map, the local costmap in odom.</text>
<text x="30" y="774" font-size="12" fill="#5F5E5A">Everything except Lichtblick runs inside the warehouse-nav2:jazzy container.</text>
</svg>
