<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>What happens when I open a pull request</title>
<desc>Flowchart of the CI run for a pull request: unit tests and the list of scenarios run first; each scenario then gets its own job and a fresh container where the robot drives through the goals; the report job checks every result and either lets the PR merge into main or blocks it.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#444441"/>
</marker>
</defs>
<rect width="1360" height="800" fill="#FFFFFF"/>

<text x="30" y="36" font-size="22" font-weight="600" fill="#2C2C2A">What happens when I open a pull request</text>
<text x="30" y="62" font-size="13" fill="#5F5E5A">The CI run as a flowchart, from the push to the merge</text>

<g font-size="12" text-anchor="middle">
<rect x="400" y="96" width="520" height="620" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>

<!-- Start and the first two jobs -->
<ellipse cx="180" cy="118" rx="125" ry="22" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text x="180" y="122" font-size="13" font-weight="600" fill="#2C2C2A">Open or update a PR</text>
<path d="M180,140 L180,163" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60" y="165" width="240" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="180" y="189" fill="#085041">GitHub Actions starts the CI</text>
<path d="M180,205 L180,223" fill="none" stroke="#444441" stroke-width="1.3"/>
<rect x="60" y="223" width="240" height="5" fill="#444441"/>
<text x="318" y="230" text-anchor="start" font-size="11" fill="#5F5E5A">in parallel</text>
<path d="M110,228 L110,248" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M257,228 L257,248" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>

<rect x="40" y="250" width="140" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="110" y="271" font-weight="600" fill="#085041">unit-tests</text>
<text x="110" y="289" font-size="11" fill="#0F6E56">pytest: 48 tests</text>
<rect x="195" y="250" width="125" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="257" y="271" font-weight="600" fill="#085041">list-scenarios</text>
<text x="257" y="289" font-size="11" fill="#0F6E56">ls scenarios/</text>

<path d="M110,300 L110,343" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="110,345 178,385 110,425 42,385" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text x="110" y="381" fill="#2C2C2A">unit tests</text>
<text x="110" y="397" fill="#2C2C2A">pass?</text>

<path d="M257,300 L257,318" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="212,320 330,320 318,356 200,356" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="265" y="342" fill="#633806">7 scenario names</text>

<!-- Both feed the scenario jobs -->
<path d="M178,385 L343,385" fill="none" stroke="#444441" stroke-width="1.3"/>
<text x="200" y="378" text-anchor="start" font-size="11" fill="#444441">yes</text>
<path d="M324,338 L343,338" fill="none" stroke="#444441" stroke-width="1.3"/>
<rect x="345" y="328" width="5" height="67" fill="#444441"/>
<path d="M350,360 L368,360 L368,173 L478,173" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>

<!-- Unit tests fail: the scenarios are skipped, the report still runs -->
<path d="M42,385 L25,385 L25,80 L1130,80 L1130,198" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="700" y="74" font-size="11" fill="#444441">no: the scenario jobs are skipped, but the report still runs</text>

<!-- Each scenario -->
<text x="660" y="120" font-size="14" font-weight="600" fill="#3C3489">For each scenario: its own CI job</text>
<text x="660" y="138" font-size="11" fill="#534AB7">all 7 in parallel, each on its own Linux VM</text>

<rect x="480" y="155" width="260" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="610" y="177" fill="#085041">Build the Docker image</text>
<path d="M610,191 L610,207" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="460" y="209" width="300" height="46" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
<text x="610" y="228" fill="#3C3489">Start a fresh container: sim.launch.py</text>
<text x="610" y="245" font-size="11" fill="#534AB7">Gazebo + Nav2 in the scenario's world</text>
<path d="M610,255 L610,271" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="480" y="273" width="260" height="36" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
<text x="610" y="295" fill="#3C3489">Set the initial pose, wait for Nav2</text>
<path d="M610,309 L610,325" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="480" y="327" width="260" height="36" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
<text x="610" y="349" fill="#3C3489">Send the next goal</text>
<text x="760" y="340" text-anchor="start" font-size="11" fill="#534AB7">while driving:</text>
<text x="760" y="356" text-anchor="start" font-size="11" fill="#534AB7">record /odom and /scan</text>
<path d="M610,363 L610,383" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>

<polygon points="610,385 735,428 610,471 485,428" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text x="610" y="424" fill="#2C2C2A">goal reached</text>
<text x="610" y="440" fill="#2C2C2A">before the timeout?</text>
<path d="M735,428 L778,428" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="748" y="420" text-anchor="start" font-size="11" fill="#444441">no</text>
<rect x="780" y="410" width="125" height="36" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
<text x="842" y="432" fill="#3C3489">stop sending goals</text>
<path d="M842,446 L842,629 L742,629" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>

<path d="M610,471 L610,493" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="618" y="486" text-anchor="start" font-size="11" fill="#444441">yes</text>
<polygon points="610,495 705,535 610,575 515,535" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text x="610" y="539" fill="#2C2C2A">more goals?</text>
<path d="M515,535 L440,535 L440,345 L478,345" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="470" y="528" font-size="11" fill="#444441">yes</text>
<path d="M610,575 L610,605" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="618" y="594" text-anchor="start" font-size="11" fill="#444441">no</text>

<rect x="480" y="607" width="260" height="44" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
<text x="610" y="625" fill="#3C3489">Evaluate the run (metrics.evaluate)</text>
<text x="610" y="642" font-size="11" fill="#534AB7">goals, time and clearance against expect</text>
<path d="M610,651 L610,667" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="507,669 725,669 713,705 495,705" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="610" y="691" fill="#633806">results/&lt;scenario&gt;.json</text>
<path d="M719,687 L950,687 L950,225 L988,225" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>

<!-- Report and merge -->
<rect x="990" y="200" width="280" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="1130" y="221" font-weight="600" fill="#085041">report job (always runs)</text>
<text x="1130" y="239" font-size="11" fill="#0F6E56">collects every JSON, writes the table</text>
<path d="M1130,250 L1130,280" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="1130,282 1265,330 1130,378 995,330" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text x="1130" y="326" fill="#2C2C2A">unit tests and</text>
<text x="1130" y="342" fill="#2C2C2A">every scenario passed?</text>

<path d="M1130,378 L1130,418" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1138" y="402" text-anchor="start" font-size="11" fill="#444441">yes</text>
<rect x="1000" y="420" width="260" height="46" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="1130" y="439" fill="#2C2C2A">required check report ✓</text>
<text x="1130" y="456" font-size="11" fill="#5F5E5A">the PR auto-merges (squash)</text>
<path d="M1130,466 L1130,488" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<ellipse cx="1130" cy="512" rx="110" ry="22" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text x="1130" y="516" font-size="13" font-weight="600" fill="#2C2C2A">Merged into main</text>

<path d="M1265,330 L1310,330 L1310,622 L1262,622" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1282" y="322" text-anchor="start" font-size="11" fill="#444441">no</text>
<rect x="1000" y="600" width="260" height="44" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="1130" y="618" fill="#2C2C2A">report ✗: the PR is blocked</text>
<text x="1130" y="635" font-size="11" fill="#5F5E5A">main stays green</text>
<path d="M1130,644 L1130,666" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<ellipse cx="1130" cy="690" rx="125" ry="22" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text x="1130" y="694" font-size="13" font-weight="600" fill="#2C2C2A">Fix it and push again</text>
</g>

<!-- Legend -->
<g font-size="12" fill="#444441">
<ellipse cx="44" cy="752" rx="14" ry="8" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text x="66" y="756">start / end</text>
<rect x="150" y="745" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
<text x="180" y="756">step</text>
<polygon points="240,743 252,752 240,761 228,752" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text x="260" y="756">decision</text>
<polygon points="340,745 362,745 358,759 336,759" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="370" y="756">data written</text>
<rect x="470" y="745" width="22" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="500" y="756">CI job step (Linux VM)</text>
<rect x="660" y="745" width="22" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="690" y="756">one scenario's job and its container</text>
</g>
<text x="30" y="785" font-size="12" fill="#5F5E5A">On my Mac, scripts/run_scenarios.sh follows the same steps for each scenario, one after another, without GitHub.</text>
</svg>
