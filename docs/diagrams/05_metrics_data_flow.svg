<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>How data flows through metrics.py</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444441"/></marker></defs>
<rect width="1360" height="800" fill="#FFFFFF"/>
<text x="30" y="36" font-size="22" font-weight="600" fill="#2C2C2A">How data flows through metrics.py</text>
<text x="30" y="62" font-size="13" fill="#5F5E5A">Data flow diagram of one scenario run: each arrow is data, labelled with what it carries. Bold boxes are the functions in metrics.py.</text>
<text x="125" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#888780">WHERE THE DATA COMES FROM</text>
<text x="395" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#888780">FIRST STEP</text>
<text x="660" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#888780">SECOND STEP</text>
<text x="930" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#888780">THE JUDGE</text>
<text x="1200" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#888780">WHAT IS SAVED</text>
<rect x="1100.0" y="240" width="200" height="360" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/>
<text x="1200" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">results/&lt;name&gt;.json</text>
<text x="1200" y="282" text-anchor="middle" font-size="11" fill="#5F5E5A">written by main() in run_scenario.py</text>
<text x="1118.0" y="318" font-size="12" fill="#2C2C2A">• name, description, expect</text>
<text x="1118.0" y="340" font-size="12" fill="#2C2C2A">• passed, reason</text>
<text x="1118.0" y="362" font-size="12" fill="#2C2C2A">• goals_reached, goals_total</text>
<text x="1118.0" y="384" font-size="12" fill="#2C2C2A">• elapsed</text>
<text x="1118.0" y="406" font-size="12" fill="#2C2C2A">• path_length</text>
<text x="1118.0" y="428" font-size="12" fill="#2C2C2A">• min_range</text>
<text x="1200" y="578" text-anchor="middle" font-size="10.5" fill="#888780">main() also copies goals_reached,</text>
<text x="1200" y="591" text-anchor="middle" font-size="10.5" fill="#888780">elapsed and min_range in here</text>
