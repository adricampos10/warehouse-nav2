# To the hallway, up the right-hand corridor, into the living room and back
# to the entrance. (I first sent it up the middle corridor, but the passage
# at its top end left about 2 cm and failed on GitHub Actions.)
description: Tour my home and come back to the entrance
world: house
# My home's passages are 60-80 cm wide and the robot is 44 cm: Nav2 cuts
# the corner into the right-hand corridor, and how close it passes varies
# from run to run (1-6 cm in my runs). A margin would make the test flaky,
# so here it only fails on contact.
min_clearance: 0.0
start: [0.0, 0.0]
goals:
  - [-3.5, 0.8]
  - [0.4, 3.5]
  - [1.1, 6.0]
  - [0.0, 0.0]
timeout: 400
